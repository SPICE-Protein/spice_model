# SPICE Pre-train configuration
# Data source defaults to the hf-mirror.com mirror (directly reachable in China)
data:
  source: hf            # "hf": download from HuggingFace | "local": read local data/parquet (output of download_pdb.py)
  hf_repo: SPICE-Protein/spice_protein
  hf_endpoint: https://hf-mirror.com   # overridable via the HF_ENDPOINT env var
  cache_dir: data/cache
  local_dir: data/parquet
  tfrecord_dir: data/tfrecords
  use_env_filtered: false  # 用满全量（~4.5w）：有环境参数的保留真实 env，缺的 normalize_env 填默认值；预训练要数据量
  min_seq_len: 40          # filter out fragments that are too short
  max_seq_len: 512         # length cap (padding length during training)
  max_shards: 0            # 0 = all shards (set 1-2 for debugging)
  structures_per_shard: 0  # 0 = all structures per shard (debug: set a few hundred)

model:
  vocab_size: 23     # PAD(0) + 20 AA + UNK(21)
  embed_dim: 256
  num_layers: 6
  num_heads: 8
  ffn_dim: 1024
  dropout: 0.1
  env_dim: 3         # normalized [pH, T, ionic strength]
  pos_max_len: 1024  # positional encoding cap
  dist_bins: 24      # binned distogram 距离分箱数（64 箱方案内存不够，折中 24）
  dist_dim: 64       # distogram 头投影维度
  dist_min: 3.0      # distogram 最小距离（Å）
  dist_max: 48.0     # distogram 最大距离（Å），超出落溢出 bin

train:
  batch_size: 96         # 64→96 with mixed_float16 (fp16 激活省一半内存)；最长 512 桶仍自动降 16-32；若 OOM 退回 64
  epochs: 30
  lr: 1.0e-3           # after collapse is broken lr is an effective lever; raised 3e-4 -> 1e-3 (3x)
  weight_decay: 1.0e-4
  warmup_steps: 1000
  grad_clip: 1.0
  val_split: 0.05
  seed: 42
  log_dir: runs/pretrain
  ckpt_dir: checkpoints/pretrain
  log_every: 50
  ckpt_every: 1000
  max_steps: 0       # 0 = run all epochs
  cache_train: true  # pre-cache an epoch's batches in RAM so the pipeline never stalls compute (first pass slow, then pure RAM)
  dist_weight: 1.0   # binned distogram CE 权重（主目标）
  pair_weight: 0.05  # 0.3→0.05：坐标头 rmsd 乱跳(17-28Å)的噪声梯度干扰 CE 学习，下调让 CE 主导
  use_gpu: true      # true = 用 GPU（若有）；false = 强制只用 CPU
  gpu_mem_growth: true  # 显存按需增长
  gpu_devices: ""    # 指定 GPU 编号白名单，如 "0" / "0,1"；空 = 全部
  use_mixed_precision: true   # FP32→fp16 混合精度：T4 上 ~2-4x 提速。distogram 头/Kabsch 已强制 fp32，loss-scale + clip-scale 已在 train_step 处理
