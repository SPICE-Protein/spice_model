data:
  cache_dir: data/cache
  hf_endpoint: https://hf-mirror.com
  hf_repo: SPICE-Protein/spice_protein
  local_dir: data/parquet
  max_chains: 45000
  max_seq_len: 512
  max_shards: 0
  min_seq_len: 40
  source: hf
  structures_per_shard: 0
  tfrecord_dir: runs/ablation/data_efficiency/n45000/tfrecords
  use_env_filtered: false
model:
  vocab_size: 23
  embed_dim: 256
  num_layers: 6
  num_heads: 8
  ffn_dim: 1024
  dropout: 0.1
  env_dim: 3
  pos_max_len: 1024
  dist_bins: 48
  dist_dim: 32
  dist_min: 3.0
  dist_max: 48.0
  distogram_fp16: true
  frame_recycle_steps: 2
  frame_refine_dim: 64
  frame_refine_heads: 4
train:
  batch_size: 96
  epochs: 30
  lr: 1.0e-3
  weight_decay: 1.0e-4
  warmup_steps: 1000
  grad_clip: 1.0
  val_split: 0.05
  seed: 42
  log_dir: runs/ablation/data_efficiency/n45000/runs
  ckpt_dir: runs/ablation/data_efficiency/n45000/checkpoints
  log_every: 50
  ckpt_every: 1000
  max_steps: 0
  cache_train: true
  cache_path: data/train_cache
  dist_weight: 1.0
  pair_weight: 1.0
  pair_warmup_steps: 3000
  frame_chirality_weight: 1.0
  frame_clash_weight: 3.0
  frame_consistency_weight: 0.5
  coord_max_len: 200
  plateau_patience: 5
  plateau_min_delta: 0.005
  plateau_auto_stop: false
  use_gpu: true
  gpu_mem_growth: true
  gpu_devices: ''
  use_mixed_precision: false
