env:
  env_abs_window: true
  env_dT_clamp: 20.0
  env_dph_clamp: 2.0
  env_offset_clamp: true
  env_offset_dim: 2
  env_ph_max: 10.0
  env_ph_min: 2.0            # ⚠️ 别抬到 5：会封死 pH2 崩溃域，路径 A 触不到 env_fail → 突变永不触发
  env_temp_max: 330.0
  env_temp_min: 260.0
  episode_max_steps: 20
  force_clamp: 0.5
  force_dim: 16
  ionic_default: 0.0
  metric_dim: 5
  mutation_every: 20
  ph_max: 14.0
  ph_min: 0.0
  ph_rebuild_threshold: 0.05
  pressure: 1.0
  relax_iters: 50
  reward_ref: 100000
  strict_incomplete: true
  temp_max: 400.0
  temp_min: 150.0
  tolerance: 2.0
  u_window: 10
es:
  conservation_external: ''
  conservation_mask: true
  conservation_threshold: 0.8
  crossover_rate: 0.5
  elites: 4
  fitness_survive_steps: 20
  freeze_backbone: true
  generations: 50
  head_b_noise: 0.05
  head_c_noise: 0.05
  mutation_rate: 0.1
  n_mutations_per_candidate:
  - 1
  - 3
  population: 8
  q_gate: 0.5
post:
  anchor_ph: 7.0
  anchor_temp: 298.0
  ckpt_dir: ../data/data_efficiency/n45000/checkpoints/posttrain
  ckpt_every: 10
  conf_batch: 16
  conf_lr: 0.0001
  conf_train_interval: 10
  env_delta_T: 5.0
  env_delta_ph: 5          # ⚠️ 必须够大才能让路径 A 触到 WT 崩溃 flank(pH2/10)；=2 时 7QF3 全程稳定 → 零突变空转
  finetune_batch_size: 16
  finetune_epochs: 1
  finetune_lr: 0.0001
  finetune_out: checkpoints/pretrain/finetuned.weights.h5
  log_dir: ../data/data_efficiency/n45000/runs/posttrain
  log_every: 10
  max_episodes: 40
  max_seq_len: 150
  min_seq_len: 70
  no_survivor_abort: 15
  escape_step_threshold: 5
  escape_after: 3
  recovery_episodes: 4
  recovery_delta_ph: 1.0
  recovery_delta_T: 5.0
  nan_watchdog: true
  path_a_threads: 2
  phase_map_dir: ../data/data_efficiency/n45000/phase_maps
  phase_map_interval: 0
  phase_map_ph_range:
  - 2.0
  - 11.0
  - 1.0
  phase_map_temp_range:
  - 250.0
  - 350.0
  - 10.0
  pretrain_ckpt: checkpoints/pretrain/best_weights.weights.h5
  pretrain_config: configs/pretrain.yaml
  pretrain_tfrecord_dir: data/tfrecords
  pseudo_label_dir: ../data/data_efficiency/n45000/pseudo_labels
  pseudo_tfrecord_path: ../data/data_efficiency/n45000/pseudo.tfrecord
  pseudo_weight_repeat: 8
  quick_check_steps: 20
sac:
  aa_dim: 20
  trace_layers: false          # 2026-08-19 逐层 NaN trace：6QQE born-NaN 重跑时改 true，定位 NaN 从哪层产生
  eager_update: false           # 2026-08-19 容器 TF 图模式坏（smoke Check 6 确认）时改 true，SAC/encode_z 走 eager 绕过
  batch_size: 32              # 2026-08-17 Verified: Works perfectly with newly deployed NaN-free and Segfault-free Numerical Safety Shield.
  buffer_capacity: 300000
  discrete_position_dim: 256
  enable_mutation_head: true
  gamma: 0.99
  gumbel_tau: 1.0
  hidden_dim: 256
  lr_actor: 0.0003
  lr_alpha: 0.0003
  lr_critic: 0.0003
  mutation_every: 20
  target_entropy_factor: 0.5
  tau: 0.005
  track_mutation_mask: true
  u_ref: 100000
  update_every_steps: 20      # 2026-08-17 Verified: Updates start immediately in Ep 0 as soon as buffer exceeds batch_size (40 >= 32).
