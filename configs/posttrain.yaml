# SPICE Post-train (RL) configuration -- dual-path: path A (SAC micro) + path B (ES macro)
env:
  relax_iters: 50             # Engine.build relaxation iterations (M5 Pro lite: 200 -> 50 for faster build; stability enforced by 20-step small-window cushion)
  tolerance: 2.0              # energy minimization tolerance (kcal/mol)
  strict_incomplete: true     # If true, reject disordered residues (throws clear error); false=truncate build (physical inaccuracy, exploratory only)
  pressure: 1.0               # bar
  ionic_default: 0.0          # M
  episode_max_steps: 20      # Max MD steps per episode. ⚠️ Current engine is reliable only within a ~5-30 step window (md_smoke tests show residual forces of 70-90 kcal/mol/Å lead to random blowups). Decreased from 200 to 20 to ensure natural Path A termination, allowing SAC to receive non-terminal rewards; can extend after adding MD equilibration
  force_dim: 16               # bias-force basis dimension M (matches engine ForceAction)
  force_clamp: 0.5            # kcal/(mol·Å)
  mutation_every: 20          # temporally layered actions: mutation every 20 steps
  env_offset_dim: 2           # [ΔpH, ΔT]
  ph_rebuild_threshold: 0.05  # Rebuild engine only if ΔpH drift exceeds this threshold (prevents repeated Engine.build on minor exploratory perturbations)
  # env-offset exploration window clamp (prevents agent from pushing env limits to non-physical regimes):
  #   A = per-step clamp (rate limiting); B = env absolute physical window (hard bounds)
  env_offset_clamp: true
  env_dph_clamp: 2.0
  env_dT_clamp: 20.0
  env_abs_window: true
  env_ph_min: 2.0        # Window narrowed (pH 12.5 is a dead zone -> 0 survivors); still broader than most PDB crystallization pH (4-9)
  env_ph_max: 10.0
  env_temp_min: 260.0
  env_temp_max: 330.0    # Likewise, avoid thermal dead zones
  u_window: 10                # potential-energy history window (Critic privileged input)
  metric_dim: 5               # M = [m1..m5]
  ph_min: 0.0
  ph_max: 14.0
  temp_min: 150.0
  temp_max: 400.0
  reward_ref: 100000         # reward = -U_t[kJ]/reward_ref -> O(1~10), keeps critic_loss magnitude stable (1e5 is typical |U| range)

sac:
  gamma: 0.99
  tau: 0.005
  lr_actor: 3.0e-4
  lr_critic: 3.0e-4
  lr_alpha: 3.0e-4
  target_entropy_factor: 0.5      # target entropy = -dim * 0.5
  buffer_capacity: 300000         # global Replay Buffer (1e6 ≈ 3.9GB RAM, Colab memory is tight; 3e5 ≈ 1.2GB, adjust according to machine)
  batch_size: 256             # SAC update batch size (512 -> 256: lightweight run starts updates earlier)
  update_every_steps: 200         # async collection: update every 200 steps (lightweight run updates earlier)
  hidden_dim: 256
  u_ref: 100000         # critic u_hist normalization baseline (= env.reward_ref; raw u_hist in kJ without normalization leads to critic_loss > 1e10)
  # mixed action (design customization 2)
  enable_mutation_head: true
  discrete_position_dim: 256      # mutation-position one-hot dim (= longest sequence)
  aa_dim: 20
  trace_layers: false             # 2026-08-19 Layer-by-layer NaN trace: locate which layer generates NaNs, set true during 6QQE re-runs
  eager_update: false             # 2026-08-19 Eager fallback: set true if containerized TF graph mode fails, bypassing @tf.function via eager mode
  gumbel_tau: 1.0
  # temporally layered actions (design customization 5)
  track_mutation_mask: true
  mutation_every: 20

es:
  population: 8               # candidate mutants per batch (M5 Pro lite: 32 -> 8, reduces build overhead by 4x per Path B trigger)
  elites: 4
  generations: 50
  mutation_rate: 0.1
  crossover_rate: 0.5
  n_mutations_per_candidate: [1, 3]   # 1-3 point mutations per candidate
  head_b_noise: 0.05
  head_c_noise: 0.05
  freeze_backbone: true
  fitness_survive_steps: 20   # Fitness/survival threshold: aligned with episode_max_steps (successful run-to-completion in engine implies stability). Otherwise 200 steps is virtually unreachable -> leads to empty pseudo-label feedback
  # Functional integrity constraint (prevents "optimizing stability at the cost of biological function", e.g. W->P mutation in active sites)
  conservation_mask: true     # Mask mutations at highly conserved positions (residue-type prior: e.g. W/C/G/F/Y)
  conservation_threshold: 0.8 # Conservation score >= 0.8 -> position is strictly protected
  conservation_external: ""   # Optional: path to external MSA conservation .npy/.npz files (per-position 0~1), overrides residue-type prior
  q_gate: 0.5                 # Level A: survival requires retaining >= 50% of native contacts (Q gating, prevents "unstable/blob-like" survival)

post:
  max_episodes: 30            # M5 Pro lightweight demo default; override with --max-episodes in production
  path_a_threads: 2           # path A dual-thread perturbation (+Δ / -Δ)
  env_delta_ph: 5.0
  env_delta_T: 5.0
  anchor_ph: 7.0              # starting environment (wild-type default)
  anchor_temp: 298.0
  max_seq_len: 150
  min_seq_len: 80            # Minimum length: <80aa are mostly small peptides without stable folded structures, poor generalization
  # stage 2: quick check (MD sprint checks physical validity)
  quick_check_steps: 20
  # path A: stability phase map (stable region / crash boundary)
  phase_map_dir: runs/posttrain/phase_maps
  phase_map_interval: 0      # Default off (110-point full grid scan is expensive on CPU); set to e.g. 50 to enable
  phase_map_temp_range: [250.0, 350.0, 10.0]
  phase_map_ph_range: [2.0, 11.0, 1.0]
  # stage 4: pseudo-label feedback
  pseudo_label_dir: data/pseudo_labels
  pseudo_tfrecord_path: data/pseudo_labels/pseudo.tfrecord
  pseudo_weight_repeat: 8     # confidence-weight repetition factor
  pretrain_tfrecord_dir: data/tfrecords
  # finetuning
  finetune_epochs: 1
  finetune_batch_size: 16
  finetune_lr: 1.0e-4
  finetune_out: checkpoints/pretrain/finetuned.weights.h5
  # Head D: dual-path confidence supervision (label = survival steps / max steps)
  conf_lr: 1.0e-4
  conf_batch: 16             # Head D sample accumulation rate ~1/ep; to train within 30 episodes, must be <= 16 (256 would never trigger)
  conf_train_interval: 10     # train every N episodes (0=off)
  log_dir: runs/posttrain
  ckpt_dir: checkpoints/posttrain
  log_every: 10
  ckpt_every: 10              # Intermediate checkpoints (prevents saving only at the end)
  no_survivor_abort: 15       # Abort only if Path B has 0 survivors for 15 consecutive episodes (6 is too strict: SAC has not finished training before buffer reaches 256)
  # Env Escape / Recovery (2026-08-18): Path A pushed by agent into "instant death" env corner -> parent
  # crashes at step 1 -> buffer stops growing -> SAC update deadlock. Continuous early crash + 0 survivors -> switch to mild env + freeze env-offset recovery.
  escape_step_threshold: 5    # Path A survival steps < this value is classified as "early crash"
  escape_after: 3             # Trigger recovery if continuous early crashes >= this value
  recovery_episodes: 4        # Number of recovery episodes (mild env + frozen env-offset)
  recovery_delta_ph: 1.0      # Recovery pH offset (anchor ± 1, stable region)
  recovery_delta_T: 5.0       # Recovery temperature offset (anchor ± 5)
  nan_watchdog: true          # SAC weights NaN watchdog: reconstructs SAC upon non-finite values to prevent deadlocks
  pretrain_ckpt: checkpoints/pretrain/best_weights.weights.h5
  pretrain_config: configs/pretrain.yaml
